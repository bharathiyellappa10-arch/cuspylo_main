<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111313">
<title>CUSPYLO — The Pie Product</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <button class="menu-toggle" type="button" onclick="toggleMenu()" aria-label="Open navigation menu" aria-controls="site-drawer" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <a class="brand" href="/" onclick="go('dash');return false" aria-label="CUSPYLO home">
    <img src="logo.png" alt="CUSPYLO — The Pie Product">
  </a>
  <nav class="nav-actions">
    <button class="nav-action nav-wishlist" type="button" onclick="go('wishlist')" aria-label="Open Wishlist">
      <span class="nav-action-icon" aria-hidden="true">♡</span><span>Wishlist</span>
    </button>
    <button class="nav-action nav-cart" type="button" onclick="go('cart')" aria-label="Open Cart">
      <span class="nav-action-icon" aria-hidden="true">🛒</span><span>Cart</span><b id="cc">0</b>
    </button>
    <span id="who"></span>
  </nav>
</header>

<div id="menu-overlay" class="menu-overlay" onclick="closeMenu()" aria-hidden="true"></div>
<aside id="site-drawer" class="site-drawer" aria-label="Main navigation" aria-hidden="true">
  <div class="drawer-head">
    <strong>Explore CUSPYLO</strong>
    <button type="button" class="drawer-close" onclick="closeMenu()" aria-label="Close navigation menu">×</button>
  </div>
  <button type="button" class="drawer-link" onclick="navigateMenu('dash')">Home</button>
  <button type="button" class="drawer-link" onclick="navigateMenu('about')">About Us</button>
  <button type="button" class="drawer-link" onclick="navigateMenu('contact')">Contact Us</button>
  <button type="button" class="drawer-link" onclick="navigateMenu('faqs')">FAQs</button>
  <button type="button" class="drawer-link" onclick="navigateMenu('joinus')">Join Us</button>
  <div class="drawer-divider"></div>
  <button type="button" class="drawer-link drawer-secondary" onclick="navigateMenu('store')">Dental Store</button>
  <button type="button" class="drawer-link drawer-secondary" onclick="navigateMenu('wishlist')">♡ My Wishlist</button>
  <button type="button" class="drawer-link drawer-secondary" onclick="navigateMenu('cart')">🛒 My Cart</button>
  <button type="button" class="drawer-link drawer-secondary" onclick="navigateMenu('account')">My Account & Orders</button>
  <div class="drawer-divider"></div>
  <button type="button" class="drawer-link drawer-secondary drawer-admin-link" onclick="navigateMenu('admin')">Admin Sign In</button>
</aside>

<main id="app" aria-live="polite"></main>
<footer id="contact">
  <div class="fgrid">
    <div><h3>Contact CUSPYLO</h3><p>Questions about an order? Message us.</p>
      <a id="wa2" class="btn wa" target="_blank" rel="noopener">Chat on WhatsApp</a>
      <p class="mut" id="em"></p><p class="mut"><a id="ig-footer" href="https://www.instagram.com/cuspylo/" target="_blank" rel="noopener">Instagram · @cuspylo</a></p><p class="mut">Secure online payments powered by Razorpay.</p></div>
    <form id="fb"><h3>Send feedback</h3>
      <input name="name" placeholder="Your name (optional)"><input name="contact" placeholder="Phone or email (optional)">
      <textarea name="message" rows="3" placeholder="What can we do better?" required></textarea>
      <button class="btn">Send feedback</button></form>
  </div>
  <p class="mut c">© CUSPYLO · Made for KCDS · <a href="#" onclick="go('admin');return false">Admin Sign In</a></p>
</footer>
<div id="toast" role="status"></div>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
